<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chemistry PPT Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-xl w-full bg-slate-800 rounded-2xl shadow-xl p-8 border border-slate-700">
        <h1 class="text-3xl font-extrabold text-white mb-2">AI Chemistry PPT Gen</h1>
        <p class="text-slate-400 mb-6">Convert your PDF into an AI-structured Chemistry presentation.</p>
        
        <input type="password" id="apiKey" placeholder="Paste Gemini API Key" class="w-full p-3 mb-4 rounded-lg bg-slate-700 text-white placeholder-slate-400 border border-slate-600 focus:ring-2 focus:ring-teal-500 outline-none">

        <div id="dropZone" class="border-4 border-dashed border-slate-600 rounded-xl p-10 text-center cursor-pointer hover:border-teal-500 transition-all duration-300">
            <input type="file" id="fileInput" class="hidden" accept="application/pdf">
            <div id="dropText">
                <p class="text-lg font-medium text-white">Drag & Drop PDF here</p>
                <p class="text-sm text-slate-400 mt-1">or click to upload</p>
            </div>
            <div id="status" class="hidden">
                <p class="text-teal-400 font-semibold" id="statusText">Processing...</p>
            </div>
        </div>

        <button id="downloadBtn" class="hidden mt-6 w-full py-3 px-4 bg-teal-500 hover:bg-teal-600 text-slate-900 font-bold rounded-lg transition-colors">
            Download Presentation
        </button>
    </div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const downloadBtn = document.getElementById('downloadBtn');
        const status = document.getElementById('status');
        const statusText = document.getElementById('statusText');
        const dropText = document.getElementById('dropText');
        const apiKeyInput = document.getElementById('apiKey');

        let presentation = null;

        dropZone.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', handleFile);
        
        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('border-teal-500'); });
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('border-teal-500'));
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('border-teal-500');
            handleFile({ target: { files: e.dataTransfer.files } });
        });

        async function handleFile(e) {
            const file = e.target.files[0];
            const apiKey = apiKeyInput.value;
            if (!apiKey) return alert('Please enter your Gemini API Key.');
            if (!file || file.type !== 'application/pdf') return alert('Please select a PDF file.');

            showStatus('Extracting PDF text...');
            const pdfData = await file.arrayBuffer();
            const pdf = await pdfjsLib.getDocument({ data: pdfData }).promise;
            
            let fullText = '';
            for (let i = 1; i <= pdf.numPages; i++) {
                const page = await pdf.getPage(i);
                const textContent = await page.getTextContent();
                fullText += textContent.items.map(item => item.str).join(' ') + ' ';
            }

            showStatus('AI is summarizing...');
            const summary = await callGemini(fullText, apiKey);
            if (!summary) return hideStatus();

            buildPresentation(summary, file.name);
        }

        async function callGemini(text, apiKey) {
            const prompt = "Summarize this Chemistry textbook chapter into a 5-to-10 slide presentation. Return ONLY valid JSON format. The structure should be an array of objects, where each object has: { 'title': 'Slide title', 'content': ['bullet 1', 'bullet 2'], 'notes': 'Punchy slide notes' }. Do not include any extra text, markdown code blocks, or explanations.";
            
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        system_instruction: { parts: [{ text: "You are a professional Chemistry Professor. Analyze the uploaded Chemical Kinetics text. Completely summarize all formulas, reaction rates, and core text concepts into 6 distinct presentation slides. Return the structured summary exactly in the requested JSON format so pptxgenjs can parse it cleanly." }] },
                        contents: [{ parts: [{ text: `${prompt}\n\nText: ${text.substring(0, 30000)}` }] }] 
                    })
                });

                const data = await response.json();
                if (!data.candidates) throw new Error(data.error?.message || 'No response from API');
                
                const jsonStr = data.candidates[0].content.parts[0].text.replace(/```json|```/g, '').trim();
                return JSON.parse(jsonStr);
            } catch (error) {
                console.error(error);
                alert('Error calling Gemini API: ' + error.message);
                return null;
            }
        }

        function buildPresentation(slides, fileName) {
            presentation = new PptxGenJS();
            presentation.layout = 'LAYOUT_16x9';

            // Define Master Slide
            presentation.defineSlideMaster({
                title: 'MASTER_SLIDE',
                background: { color: '0f172a' },
                objects: [
                    { text: { text: 'Chemical Kinetics Summary', options: { x: 0.5, y: 0.1, fontSize: 14, color: '14b8a6' } } }
                ]
            });

            slides.forEach((slideData) => {
                const slide = presentation.addSlide({ masterName: 'MASTER_SLIDE' });
                slide.addText(slideData.title, { x: 0.5, y: 0.5, fontSize: 32, bold: true, color: 'ffffff' });
                slide.addText(slideData.content.map(c => ({ text: c, options: { bullet: true, color: 'ffffff' } })), { 
                    x: 0.5, y: 1.5, fontSize: 18, color: 'ffffff', w: '90%' 
                });
                slide.addNotes(slideData.notes);
            });

            hideStatus();
            downloadBtn.classList.remove('hidden');
            downloadBtn.onclick = () => presentation.writeFile({ fileName: `${fileName.replace('.pdf', '')}_summary.pptx` });
        }

        function showStatus(msg) {
            dropText.classList.add('hidden');
            status.classList.remove('hidden');
            statusText.textContent = msg;
        }

        function hideStatus() {
            status.classList.add('hidden');
            dropText.classList.remove('hidden');
        }
    </script>
</body>
</html>
